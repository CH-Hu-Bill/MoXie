<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="人生重开模拟器">
    <title>人生重开模拟器</title>
    <link id="themeLink" rel="stylesheet" href="view/light.css">
    <link rel="stylesheet" href="view/landscape-fix.css">
</head>
<body style="margin: 0; height: 100%">
  <div class="banners-container">
    <div class="banners">
      <div class="banner error">
        <div class="banner-icon"><span class="iconfont">&#xe6a1;</span></div>
        <pre class="banner-message">Oops! Something went wrong!</pre>
        <div class="banner-close" onclick="hideBanners()"><span class="iconfont">&#xe6a8;</span></div>
      </div>
      <div class="banner success">
        <div class="banner-icon"><span class="iconfont">&#xe6a2;</span></div>
        <pre class="banner-message">Everything was fine!</pre>
        <div class="banner-close" onclick="hideBanners()"><span class="iconfont">&#xe6a8;</span></div>
      </div>
      <div class="banner info">
        <div class="banner-icon"><span class="iconfont">&#xe6a3;</span></div>
        <pre class="banner-message">Here is some useful information</pre>
        <div class="banner-close" onclick="hideBanners()"><span class="iconfont">&#xe6a8;</span></div>
      </div>
    </div>
  </div>
  <div id="lifeBootError" style="display:none;position:fixed;inset:0;z-index:99;align-items:center;justify-content:center;background:#17171d;color:#eee;font-family:sans-serif;padding:24px;text-align:center;">
    <div style="max-width:680px;width:100%;">
      <p style="font-size:18px;margin:0 0 12px;">游戏脚本没有加载成功</p>
      <p style="font-size:13px;line-height:1.7;color:#aaa;margin:0 0 12px;">请先按 Ctrl + F5 强制刷新。仍然空白时，把下面的错误信息发给管理员。</p>
      <pre id="lifeBootDetail" style="max-height:180px;overflow:auto;text-align:left;white-space:pre-wrap;word-break:break-all;background:#0e0e13;border:1px solid #333;border-radius:4px;padding:10px;color:#ffb4a8;font-size:11px;line-height:1.5;margin:0 0 14px;"></pre>
      <button type="button" onclick="location.reload()" style="padding:8px 18px;border:1px solid #777;border-radius:4px;background:#2a2a33;color:#fff;font-size:14px;">刷新重试</button>
    </div>
  </div>
  <script>
    (function () {
      var detail = document.getElementById('lifeBootDetail');
      var shown = false;
      function addDetail(text) {
        if (!detail) return;
        detail.textContent += (detail.textContent ? '\n' : '') + text;
      }
      function showBootError(text) {
        if (window.__lifeLoaded) return;
        if (text) addDetail(text);
        var el = document.getElementById('lifeBootError');
        if (el) el.style.display = 'flex';
        shown = true;
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && e.target !== window) {
          var tag = e.target.tagName || '';
          var url = e.target.src || e.target.href || '';
          showBootError('资源加载失败：' + tag + ' ' + url);
        } else {
          showBootError('脚本错误：' + (e.message || '未知错误') + '\n位置：' + (e.filename || '') + ':' + (e.lineno || 0));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : '未知 Promise 错误';
        showBootError('Promise 错误：' + reason);
      });
      setTimeout(function () {
        if (!window.__lifeLoaded && !shown) {
          showBootError('脚本已请求，但 8 秒内没有完成初始化。请检查 dist/bundle.js 是否可访问、浏览器 Console 是否有报错。');
        }
      }, 8000);
    })();
  </script>
  <script src="dist/bundle.js?v=3"></script>
</body>
</html>
