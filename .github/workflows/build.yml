name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/myapp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/myapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create API config
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL secret not set, using example config"
            cp lib/config/api_config.example.dart lib/config/api_config.dart
          else
            echo "Generating api_config.dart from secret"
            cat > lib/config/api_config.dart <<EOF
          class ApiConfig {
            static const String baseUrl = '$API_BASE_URL';
            static const String apiEndpoint = '\$baseUrl/app_api.php';
            static const String appVersion = '1.0.8';
          }
          EOF
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/moxie.jks
            echo "Keystore decoded"
          else
            echo "No KEYSTORE_BASE64 secret set, using debug signing"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        env:
          KEYSTORE_FILE: moxie.jks
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_KEY_PASS: ${{ secrets.KEY_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: listenwrite-release
          path: app/myapp/build/app/outputs/flutter-apk/app-release.apk
          # 旧包自动过期（私有仓库免费额度仅 500MB，APK 约 35MB/个，必须设保留期防打满）
          retention-days: 14