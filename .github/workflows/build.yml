name: Build APK

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/myapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP version: $VERSION"
          if [[ "${GITHUB_REF_NAME}" == app-v* && "${GITHUB_REF_NAME}" != "app-v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${VERSION}" >&2
            exit 1
          fi

      - name: Create API config
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL secret not set, using example config"
            cp lib/config/api_config.example.dart lib/config/api_config.dart
          else
            echo "Generating api_config.dart from secret"
            cat > lib/config/api_config.dart <<EOF
          class ApiConfig {
            static String baseUrl = '$API_BASE_URL';
            static String get apiEndpoint => '\$baseUrl/app_api.php';
            static const String appVersion = '2.0.0';
            static const String minWebVersion = '2.0.0';
          }
          EOF
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/moxie.jks
            echo "Keystore decoded"
          else
            echo "No KEYSTORE_BASE64 secret set, using debug signing"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # 项目存量 warning/info 较多；CI 只阻断真正的 error
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Unit tests (gallery item)
        run: flutter test test/gallery_item_test.dart

      - name: Build split APKs (release)
        env:
          KEYSTORE_FILE: moxie.jks
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_KEY_PASS: ${{ secrets.KEY_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # S2 暂保留 skip flag：Flutter 3.50 要求 Gradle >=9.3.1，项目仍是 9.1.0。
        # 后续升级 Gradle 后移除该 flag。
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: List APKs
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: listenwrite-${{ steps.version.outputs.version }}-test
          path: |
            app/myapp/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/myapp/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 7

      - name: Release versioned APKs
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.version.outputs.version }}
          name: ListenWrite APP v${{ steps.version.outputs.version }}
          body: |
            ## v${{ steps.version.outputs.version }}
            - 班级图集支持实况照片上传与播放（Android Motion Photo）
            - 服务端 2.0.0：版本契约、CORS/会话加固、图集实况存储
            - 请按手机架构选择安装包：大多数手机选 `arm64-v8a`，较旧手机选 `armeabi-v7a`
          files: |
            app/myapp/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/myapp/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update apk-latest pointer
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Latest
          body: |
            ## 最新 APK
            大多数手机选 `arm64-v8a`，较旧手机选 `armeabi-v7a`。
          files: |
            app/myapp/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/myapp/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
