name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/myapp/**'
  workflow_dispatch:

permissions:
  contents: write # 发布 APK 到 GitHub Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/myapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create API config
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL secret not set, using example config"
            cp lib/config/api_config.example.dart lib/config/api_config.dart
          else
            echo "Generating api_config.dart from secret"
            cat > lib/config/api_config.dart <<EOF
          class ApiConfig {
            static String baseUrl = '$API_BASE_URL';
            static String get apiEndpoint => '\$baseUrl/app_api.php';
            static const String appVersion = '1.2.0';
          }
          EOF
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/moxie.jks
            echo "Keystore decoded"
          else
            echo "No KEYSTORE_BASE64 secret set, using debug signing"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        env:
          KEYSTORE_FILE: moxie.jks
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_KEY_PASS: ${{ secrets.KEY_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release

      - name: Release APK
        # 发布到 GitHub Release 而非 Artifact：Release 资产不占 Actions 存储配额
        # （私有仓库免费额度仅 500MB，Artifact 上传常被 "storage quota has been hit" 拦截；
        #  固定 tag=apk-latest 覆盖式发布，保留最新一版 APK，下载入口 = Releases 页）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Latest
          body: |
            ## v1.2.0
            - 知识库拆分为 单词 / 句子 / 作文 三个板块，带数量角标（与网页端一致）
            - 每个板块独立定位到该类型最近一次默写位置；搜索命中自动切到对应板块并定位
            - 修复静默刷新：其他设备新增 / 删改的内容会自动刷新出来
            - 添加弹窗支持选择类型与「AI 补全 / AI 直译」，并修复键盘遮挡问题
            - 错题本、任务详情、搜索均支持句子与作文
          files: app/myapp/build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}